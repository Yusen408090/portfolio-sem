<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portafolio de Yuan Sen: diseño UI/UX y desarrollo frontend." />
    <title>Yuan Sen | Portafolio</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#f8fafc',
              foreground: '#1e293b',
              surface: '#ffffff',
              primary: { DEFAULT: '#4f46e5', light: '#c7d2fe' }
            }
          }
        }
      };
    </script>
    <style>
      html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
      body { margin: 0; background: #f8fafc; color: #1e293b; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }
    </style>
    <script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script defer src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Activa JavaScript para visualizar este portafolio.</noscript>
    <script type="text/babel" data-presets="react" src="./app.jsx"></script>
  </body>
</html>
